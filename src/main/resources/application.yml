server:
  port: 8081

spring:
  application:
    name: zhixing
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zhixing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

zhixing:
  jwt:
    secret: zhixing-secret-key-1234567890-abcdefghijklmn
    expire-hours: 24

logging:
  level:
    com.wanglei.zhixing: debug
